      justify-content: space-between;
      align-items: center;

      border: 1px solid #c6e3d9;
      border-radius: 12px;
      color: #102c2b;
      text-decoration: none;
      font-weight: 700;
      background: #f5fbf8;
      transition: 0.2s ease;
    }

    .link:hover {
      background: #e0f5ec;
      border-color: #087f70;
      transform: translateY(-3px);
    }

    .open {
      color: #087f70;
      white-space: nowrap;
    }

    footer {
      text-align: center;
      padding: 25px;
      color: #66827a;
    }

    @media (max-width: 600px) {
