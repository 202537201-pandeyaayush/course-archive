
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="Page not found - Aayush Pandey Web Programming Course Archive">
    <title>404 - Page Not Found | Aayush Pandey</title>

    <link rel="stylesheet" href="assets/style.css">
    <link rel="stylesheet" href="week10_2/week10.css">

    <style>
        .error-container {
            max-width: 850px;
            margin: 70px auto;
            padding: 30px 24px;
            text-align: center;
        }

        .error-code {
            color: #2563eb;
            font-size: clamp(5rem, 15vw, 9rem);
            font-weight: 800;
            line-height: 1;
            margin: 0 0 15px;
        }

        .error-container h1 {
            font-size: 2rem;
            margin-bottom: 15px;
        }

        .error-message {
            max-width: 550px;
            margin: 0 auto 30px;
            line-height: 1.7;
        }

        .error-actions {
            display: flex;
            justify-content: center;
            flex-wrap: wrap;
            gap: 12px;
            margin-top: 25px;
        }

        .action-link {
            display: inline-block;
            padding: 12px 22px;
            border-radius: 8px;
            background: #2563eb;
            color: white;
            text-decoration: none;
            font-weight: 700;
        }

        .action-link:hover {
            background: #1d4ed8;
        }

        .action-link.alt {
            background: #1f2937;
        }

        .action-link.alt:hover {
            background: #374151;
        }
    </style>
</head>

<body>

    <header class="bar">
        <nav aria-label="Main navigation">
            <a href="index.html">Web Programming</a>
            <span aria-hidden="true"> / </span>
            <a href="week10_2/index.html">Week 10</a>
            <span aria-hidden="true"> / </span>
            <span aria-current="page">404 Error</span>
        </nav>
    </header>

    <main class="error-container">
        <p class="error-code">404</p>

        <h1>Page Not Found</h1>

        <p class="error-message">
            Sorry! The page you are looking for may have been moved,
            deleted, or the link may be incorrect.
        </p>

        <div class="error-actions">
            <a class="action-link" href="week10_2/index.html">
                Back to Week 10
            </a>

            <a class="action-link alt" href="index.html">
                Course Archive Home
            </a>
        </div>
    </main>

</body>
</html>
