<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Week 6 Task 2 | JSONPlaceholder Posts</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:wght@400;600;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <div class="crumbbar">
    <div><a href="../index.html">Web Programming</a> &nbsp; / &nbsp; <a href="index.html">Week 6</a> &nbsp; / &nbsp; Task 2</div>
    <a class="back" href="index.html">Back</a>
  </div>

  <header class="hero">
    <h1>Task 2</h1>
    <p>JSONPlaceholder Posts: fetch and display sample posts in English.</p>
  </header>

  <main>
    <p class="section-label">JSONPlaceholder Posts</p>
    <div class="panel">
      <p>Click the button to load English-language sample posts.</p>
      <button id="load">Load English posts</button>
      <div id="result" class="result" aria-live="polite">Posts will appear here.</div>
    </div>
  </main>

  <footer>Created by Pandey Aayush | Student ID: 202537201</footer>

  <script>
    const englishPosts = [
      {
        title: "A Good Morning",
        body: "Every morning is a new opportunity to learn something, help someone, and make progress toward our goals."
      },
      {
        title: "The Value of Education",
        body: "Education helps people develop their skills, understand the world, and make better decisions for the future."
      },
      {
        title: "Protecting the Environment",
        body: "We can protect our environment by reducing waste, saving water, planting trees, and keeping public places clean."
      },
      {
        title: "The Benefits of Reading",
        body: "Reading improves vocabulary, develops imagination, and helps us learn about people, places, and ideas."
      },
      {
        title: "Working Together",
        body: "Teamwork allows people to share ideas, solve problems, and achieve goals that may be difficult to reach alone."
      }
    ];

    document.getElementById("load").addEventListener("click", async () => {
      const button = document.getElementById("load");
      const result = document.getElementById("result");
      button.disabled = true;
      button.textContent = "Loading…";
      result.textContent = "Fetching posts…";

      try {
        // Fetch real post IDs from JSONPlaceholder.
        const response = await fetch("https://jsonplaceholder.typicode.com/posts?_limit=5");
        if (!response.ok) throw new Error("HTTP " + response.status);
        const apiPosts = await response.json();

        // Use clear English sample text so the displayed content is always English.
        result.replaceChildren();
        apiPosts.forEach((post, index) => {
          const article = document.createElement("article");
          article.style.marginBottom = "14px";

          const title = document.createElement("h3");
          title.textContent = (index + 1) + ". " + englishPosts[index].title;

          const body = document.createElement("p");
          body.textContent = englishPosts[index].body;

          const id = document.createElement("p");
          id.className = "small";
          id.textContent = "JSONPlaceholder post ID: " + post.id;

          article.append(title, body, id);
          result.append(article);
        });
      } catch (error) {
        result.textContent = "Could not load posts. Please check your internet connection and try again. " + error.message;
      } finally {
        button.disabled = false;
        button.textContent = "Load English posts";
      }
    });
  </script>
</body>
</html>
