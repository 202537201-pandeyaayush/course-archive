<body>
<div class="crumbbar"><div><a href="../index.html">Web Programming</a> &nbsp; / &nbsp; <a href="index.html">Week 6</a> &nbsp; / &nbsp; Task 1</div><a class="back" href="index.html">Back</a></div>
<header class="hero"><h1>Task 1</h1><p>Random Joke Fetcher: Fetch and display one random joke.</p></header>
<main><p class="section-label">Random Joke Fetcher</p><div class="panel">
<p>Click the button to get a new joke from a public API.</p>
<button id="load">Get a joke</button>
<div id="result" class="result">Your joke will appear here.</div>
</div></main>
<footer>Created by Pandey Aayush | Student ID: 202537201</footer>
<script>
async function fetchJson(url) {
  const response = await fetch(url);
  if (!response.ok) throw new Error("Request failed (HTTP " + response.status + ")");
  return response.json();
}
function showError(id, error) { document.getElementById(id).textContent = "Could not load data. Check your internet connection and try again. " + error.message; }

document.getElementById("load").addEventListener("click", async () => {
  const out = document.getElementById("result"); out.textContent = "Loading joke…";
  try { const joke = await fetchJson("https://official-joke-api.appspot.com/random_joke");
    out.replaceChildren();
    const setup = document.createElement("p"); setup.textContent = joke.setup;
    const punchline = document.createElement("strong"); punchline.textContent = joke.punchline;
    out.append(setup, punchline);
  } catch (e) { showError("result", e); }
});

</script>
</body></html>
