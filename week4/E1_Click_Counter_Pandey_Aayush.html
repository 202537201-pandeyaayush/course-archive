<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>E1 - Click Counter - Aayush Pandey</title>
  <style>
    body { font-family: Arial, sans-serif; text-align: center; padding: 40px; }
    .student { color: #555; margin-bottom: 25px; }
    #clicker {
      padding: 14px 32px; font-size: 18px; border: none;
      background: #1a56db; color: white; border-radius: 10px;
      cursor: pointer; transition: background .3s;
    }
    #clicker.done { background: #16a34a; }
    #count { font-size: 32px; font-weight: bold; margin: 16px 0; }
    #message { font-size: 16px; color: #666; }
  </style>
</head>
<body>
  <h1>Click Counter</h1>
  <p class="student">Pandey Aayush · 202537201 · Computer Engineering</p>

  <button id="clicker">Click me!</button>
  <p id="count">0</p>
  <p id="message">Keep clicking...</p>

  <script>
    const btn = document.querySelector('#clicker');
    const countEl = document.querySelector('#count');
    const msg = document.querySelector('#message');
    let count = 0;

    btn.addEventListener('click', () => {
      count++;
      countEl.textContent = count;

      if (count >= 5) {
        btn.classList.add('done');
        msg.textContent = '🎉 Congratulations! You clicked 5 times!';
      }
    });
  </script>
<script src="../assets/site-nav.js"></script>
</body>
</html>
