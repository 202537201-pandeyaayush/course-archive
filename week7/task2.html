<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1">
<title>Week 7 Task 2 | Book Search</title>
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:wght@400;600;700;800&display=swap" rel="stylesheet">
<link rel="stylesheet" href="style.css">
</head>
<body>
<div class="crumbbar"><div><a href="../index.html">Web Programming</a> &nbsp; / &nbsp; <a href="index.html">Week 7</a> &nbsp; / &nbsp; Task 2</div><a class="back" href="index.html">Back</a></div>
<header class="hero"><h1>Step 2</h1><p>Search by title and show matching books.</p></header>
<main>
  <div class="panel">
    <h2>📚 Book Search</h2>
    <p>Discover books by title using the Open Library Search API.</p>
    <form class="search-form" id="searchForm">
      <input id="query" type="search" placeholder="Search books…" aria-label="Book title" autocomplete="off">
      <button id="searchButton" type="submit">Search</button>
    </form>
    <p class="hint" id="hint">Search for your favorite books!</p>
    <h2 class="results-title">Results</h2>
    <div class="results" id="results" aria-live="polite"><p class="status">Enter a book title to get started.</p></div>
  </div>
</main>
<footer>Created by Pandey Aayush | Student ID: 202537201</footer>
<script>
  document.getElementById('searchForm').addEventListener('submit', event => {
    event.preventDefault();
    searchBooks();
  });

      const results = document.getElementById('results');
      async function searchBooks() {
        const query = document.getElementById('query').value.trim();
        results.replaceChildren();
        if (!query) { results.textContent = 'Please enter a book title.'; return; }
        try {
          const response = await fetch('https://openlibrary.org/search.json?title=' + encodeURIComponent(query) + '&limit=10');
          const data = await response.json();
          (data.docs || []).forEach(book => {
            const item = document.createElement('article'); item.className = 'book';
            const text = document.createElement('div');
            const h = document.createElement('h3'); h.textContent = book.title || 'Untitled';
            const p = document.createElement('p'); p.textContent = 'Author(s): ' + ((book.author_name || ['Not listed']).slice(0,3).join(', '));
            text.append(h,p); item.append(text); results.append(item);
          });
          if (!results.children.length) results.textContent = 'No matching books found.';
        } catch (e) { results.textContent = 'Something went wrong while searching.'; }
      }

</script>
</body></html>
