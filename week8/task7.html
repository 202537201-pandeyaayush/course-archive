<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>Login Form | Week 8</title><link rel="stylesheet" href="style.css"></head><body><nav class="bar"><div><a class="brand" href="../index.html">Web Programming</a><span class="crumb">/</span><a class="brand" href="index.html">Week 8</a></div><a class="back" href="index.html">Back</a></nav><header class="hero"><p class="eyebrow">PART 2 · FORMS IN PRACTICE</p><h1>Login Form</h1><p>Build a login form with email, password, remember-me checkbox, and sign-in button.</p></header><main class="wrap"><section class="panel"><form class="demo" onsubmit="event.preventDefault();document.getElementById('result').textContent='Login form validated locally. No account was accessed.'"><div class="field"><label for="login-email">Email</label><input id="login-email" type="email" placeholder="name@example.com" required></div><div class="field"><label for="login-password">Password</label><input id="login-password" type="password" minlength="8" placeholder="At least 8 characters" required></div><label><input type="checkbox" name="remember"> Remember me</label><button class="btn">Sign In</button></form><p id="result" class="result" aria-live="polite">This is a front-end demonstration only.</p><div class="tasknav"><a class="back" href="task6.html">← Previous task</a> <a class="back" href="task8.html">Next task →</a></div></section></main><footer class="footer">Pandey Aayush · Student ID: 202537201</footer></body></html>
