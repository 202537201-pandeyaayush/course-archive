<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>Student Form Validation | Week 8</title><link rel="stylesheet" href="style.css"></head><body><nav class="bar"><div><a class="brand" href="../index.html">Web Programming</a><span class="crumb">/</span><a class="brand" href="index.html">Week 8</a></div><a class="back" href="index.html">Back</a></nav><header class="hero"><p class="eyebrow">PART 2 · FORMS IN PRACTICE</p><h1>Student Form Validation</h1><p>Validate student ID, email, password, and age using HTML attributes.</p></header><main class="wrap"><section class="panel"><form class="demo" onsubmit="event.preventDefault();document.getElementById('result').textContent='Student form passed browser validation.'"><div class="field"><label for="sid">Student ID (9 digits)</label><input id="sid" pattern="[0-9]{9}" placeholder="202537201" required></div><div class="field"><label for="s-email">Gachon email</label><input id="s-email" type="email" pattern=".+@gachon\.ac\.kr" placeholder="name@gachon.ac.kr" required></div><div class="field"><label for="s-pass">Password</label><input id="s-pass" type="password" minlength="8" placeholder="At least 8 characters" required></div><div class="field"><label for="s-age">Age</label><input id="s-age" type="number" min="16" max="100" placeholder="Enter your age" required></div><button class="btn">Submit</button></form><p id="result" class="result" aria-live="polite">Try invalid values to see browser validation messages.</p><div class="tasknav"><a class="back" href="task7.html">← Previous task</a> <a class="back" href="task9.html">Next task →</a></div></section></main><footer class="footer">Pandey Aayush · Student ID: 202537201</footer></body></html>
