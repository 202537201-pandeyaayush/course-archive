<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>E3 - To-Do List - Aayush Pandey</title>
  <style>
    body { font-family: Arial, sans-serif; padding: 30px; max-width: 500px; margin: auto; }
    h1 { color: #1a56db; }
    .student { color: #666; margin-bottom: 20px; }
    .add-row { display: flex; gap: 8px; margin-bottom: 14px; }
    input {
      flex: 1; padding: 10px 12px; border: 2px solid #c8d4f0;
      border-radius: 8px; font-size: 15px;
    }
    button {
      padding: 8px 16px; border: none; border-radius: 8px;
      cursor: pointer; font-size: 15px; font-weight: bold;
    }
    .add-btn { background: #1a56db; color: white; }
    #todo-list { list-style: none; padding: 0; }
    .todo-item {
      display: flex; align-items: center; justify-content: space-between;
      padding: 10px 14px; margin-bottom: 6px; background: #f0f4ff;
      border-radius: 8px; border: 1px solid #c8d4f0;
    }
    .del-btn { background: #dc2626; color: white; padding: 4px 10px; font-size: 12px; }
    #empty-msg { color: #9ca3af; text-align: center; padding: 20px; }
  </style>
</head>
<body>
  <h1>My To-Do List</h1>
  <p class="student">Pandey Aayush · 202537201 · Computer Engineering</p>

  <div class="add-row">
    <input id="todo-input" type="text" placeholder="Add a task...">
    <button id="add-btn" class="add-btn">+ Add</button>
  </div>

  <ul id="todo-list"></ul>
  <p id="empty-msg">No tasks yet! Add one above.</p>

  <script>
    const input = document.querySelector('#todo-input');
    const addBtn = document.querySelector('#add-btn');
    const list = document.querySelector('#todo-list');
    const emptyMsg = document.querySelector('#empty-msg');

    function updateEmpty() {
      emptyMsg.style.display = list.children.length === 0 ? 'block' : 'none';
    }

    function addTask() {
      const text = input.value.trim();
      if (!text) return;

      const li = document.createElement('li');
      li.className = 'todo-item';

      const taskText = document.createElement('span');
      taskText.textContent = text;

      const deleteBtn = document.createElement('button');
      deleteBtn.className = 'del-btn';
      deleteBtn.textContent = '✕';

      li.appendChild(taskText);
      li.appendChild(deleteBtn);
      list.appendChild(li);

      input.value = '';
      updateEmpty();
      input.focus();
    }

    addBtn.addEventListener('click', addTask);

    input.addEventListener('keydown', (e) => {
      if (e.key === 'Enter') {
        addTask();
      }
    });

    // Event delegation: one listener handles all delete buttons.
    list.addEventListener('click', (e) => {
      if (e.target.classList.contains('del-btn')) {
        e.target.closest('li').remove();
        updateEmpty();
      }
    });

    updateEmpty();
  </script>
<script src="../assets/site-nav.js"></script>
</body>
</html>
