<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>E2 - Dark Mode Toggle - Aayush Pandey</title>
  <style>
    body {
      font-family: Arial, sans-serif;
      padding: 40px;
      display: flex;
      justify-content: center;
      background: #f5f5f5;
    }
    .card {
      padding: 24px; border-radius: 16px; width: 280px;
      background: #f0f4ff; border: 2px solid #c8d4f0;
      text-align: center; transition: all 0.3s;
    }
    .card.dark {
      background: #1a2340; border-color: #3a4a70; color: white;
    }
    .avatar {
      width: 70px; height: 70px; border-radius: 50%;
      background: #1a56db; color: white; display: inline-flex;
      align-items: center; justify-content: center;
      font-size: 22px; margin-bottom: 12px;
    }
    button {
      padding: 8px 20px; border-radius: 20px; cursor: pointer;
      border: none; margin-top: 14px; font-weight: bold;
    }
  </style>
</head>
<body>
  <div id="card" class="card">
    <div class="avatar">AP</div>
    <h2>Pandey Aayush</h2>
    <p>Computer Engineering Student</p>
    <p>Interested in Software Engineering, Graphic Design &amp; Video Editing.</p>
    <button id="toggle-btn">🌙 Dark Mode</button>
  </div>

  <script>
    const card = document.querySelector('#card');
    const btn = document.querySelector('#toggle-btn');

    btn.addEventListener('click', () => {
      card.classList.toggle('dark');

      if (card.classList.contains('dark')) {
        btn.textContent = '☀️ Light Mode';
      } else {
        btn.textContent = '🌙 Dark Mode';
      }
    });
  </script>
<script src="../assets/site-nav.js"></script>
</body>
</html>
