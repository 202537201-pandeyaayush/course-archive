<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Aayush - Position Badge</title>
<style>
  body{font-family:Arial,sans-serif;background:#f0fdfa;min-height:100vh;
       display:flex;justify-content:center;align-items:center}
  .card{position:relative;width:280px;height:180px;background:white;
        border:2px solid #0f766e;border-radius:12px;padding:24px;
        box-sizing:border-box;box-shadow:0 8px 24px rgba(0,0,0,.08)}
  .badge{position:absolute;top:-12px;right:14px;background:#0f766e;
         color:white;padding:6px 14px;border-radius:999px;font-size:12px;
         font-weight:700}
  h1{font-size:22px;color:#0f766e;margin:28px 0 8px}
  p{color:#475569;line-height:1.5}
</style>
</head>
<body>
  <div class="card">
    <span class="badge">SALE</span>
    <h1>Design Project</h1>
    <p>A small practice card for Aayush's CSS positioning exercise.</p>
  </div>
<script src="../../assets/site-nav.js"></script>
</body>
</html>
