<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0">
<title>Aayush Pandey - CSS Advanced Portfolio</title>
<style>
  :root{--primary:#0f766e;--accent:#14b8a6;--bg:#f0fdfa;
        --text:#1e293b;--card:#ffffff;--radius:14px}
  @media(prefers-color-scheme:dark){
    :root{--bg:#051a0a;--text:#d4edda;--card:#0b2017}
  }
  *{box-sizing:border-box;margin:0;padding:0}
  body{background:var(--bg);color:var(--text);font-family:'Segoe UI',Arial,sans-serif}
  nav{position:fixed;top:0;left:0;right:0;z-index:100;background:#1e293b;
      display:flex;justify-content:space-between;align-items:center;padding:14px 30px}
  nav span{color:var(--accent);font-weight:700;font-size:1.2rem}
  nav a{color:#cbd5e1;text-decoration:none;margin-left:20px;transition:color .2s}
  nav a:hover{color:var(--accent)}
  @keyframes fadeIn{from{opacity:0;transform:translateY(28px)}
                     to{opacity:1;transform:translateY(0)}}
  .hero{padding:140px 30px 80px;text-align:center;
        background:linear-gradient(135deg,var(--bg),#ccfbf1)}
  .hero h1{font-size:2.5rem;color:var(--primary);animation:fadeIn .8s ease-out forwards}
  .hero p{margin-top:12px;color:#64748b;animation:fadeIn .8s ease-out .15s both}
  .skills-section{padding:0 24px 80px}
  .sticky-h2{position:sticky;top:56px;background:var(--bg);color:var(--primary);
             padding:14px 0 10px;border-bottom:3px solid var(--accent);
             margin-bottom:20px;z-index:10}
  .grid{display:grid;grid-template-columns:1fr;gap:16px}
  @media(min-width:640px){.grid{grid-template-columns:repeat(3,1fr)}}
  .card{border:2px solid var(--accent);border-radius:var(--radius);padding:24px;
        background:var(--card);color:var(--text);font-weight:600;
        transition:transform .25s ease,box-shadow .25s ease}
  .card:hover{transform:translateY(-6px);box-shadow:0 12px 30px rgba(15,118,110,.18)}
  .card[data-icon]::before{content:attr(data-icon);display:block;font-size:2rem;margin-bottom:10px}
</style>
</head>
<body>
<nav>
  <span>Aayush Pandey</span>
  <div><a href="#">Home</a><a href="#skills">Skills</a></div>
</nav>

<section class="hero">
  <h1>Hello, I am Aayush Pandey</h1>
  <p>Computer Engineering · Gachon University · Week 3 CSS Advanced</p>
</section>

<section class="skills-section" id="skills">
  <h2 class="sticky-h2">My Skills & Interests</h2>
  <div class="grid">
    <div class="card" data-icon="💻">Software Engineering</div>
    <div class="card" data-icon="🎨">Graphic Design</div>
    <div class="card" data-icon="🎬">Video Editing</div>
    <div class="card" data-icon="🌐">HTML & CSS</div>
    <div class="card" data-icon="📐">Flexbox & CSS Grid</div>
    <div class="card" data-icon="📱">Responsive Web Design</div>
  </div>
</section>
<script src="../../assets/site-nav.js"></script>
</body>
</html>
