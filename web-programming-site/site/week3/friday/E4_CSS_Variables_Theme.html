<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Aayush - CSS Variables Theme</title>
<style>
  :root{
    --primary:#6d28d9;
    --accent:#a78bfa;
    --bg:#f5f3ff;
    --text:#312e81;
    --card:#ffffff;
    --radius:14px;
    --space:20px;
  }
  @media(prefers-color-scheme:dark){
    :root{--primary:#c4b5fd;--accent:#8b5cf6;--bg:#18181b;
          --text:#ede9fe;--card:#27272a}
  }
  *{box-sizing:border-box}
  body{margin:0;padding:var(--space);font-family:Arial,sans-serif;
       background:var(--bg);color:var(--text)}
  .btn{background:var(--primary);color:white;border:0;padding:10px 18px;
       border-radius:var(--radius);cursor:pointer}
  .btn:hover{background:var(--accent)}
  .card{margin-top:var(--space);padding:var(--space);background:var(--card);
        border:2px solid var(--accent);border-radius:var(--radius)}
</style>
</head>
<body>
  <h1>Aayush's Study Theme</h1>
  <button class="btn">Open Portfolio</button>
  <div class="card">CSS variables keep my colours, spacing, and radius consistent.</div>
<script src="../../assets/site-nav.js"></script>
</body>
</html>
