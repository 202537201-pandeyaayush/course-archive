<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Aayush - Hover Card</title>
<style>
  body{font-family:Arial,sans-serif;padding:50px;background:#f8fafc}
  .card{width:260px;padding:24px;background:white;border:2px solid #14b8a6;
        border-radius:14px;color:#0f766e;transition:transform .25s ease,
        box-shadow .25s ease,background .25s ease}
  .card:hover{transform:translateY(-7px);background:#ecfeff;
              box-shadow:0 14px 30px rgba(15,118,110,.20)}
  h2{margin-top:0}
  p{color:#475569;line-height:1.5}
</style>
</head>
<body>
  <div class="card">
    <h2>Graphic Design</h2>
    <p>Hover over this card to see a smooth CSS transition.</p>
  </div>
<script src="../../assets/site-nav.js"></script>
</body>
</html>
