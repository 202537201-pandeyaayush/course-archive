<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Aayush - Loading Spinner</title>
<style>
  body{margin:0;height:240px;display:flex;justify-content:center;align-items:center;
       background:#f0fdfa}
  @keyframes spin{
    from{transform:rotate(0deg)}
    to{transform:rotate(360deg)}
  }
  .spinner{width:50px;height:50px;border-radius:50%;
           border:4px solid #ccfbf1;border-top-color:#0f766e;
           animation:spin .8s linear infinite}
</style>
</head>
<body>
  <div class="spinner" aria-label="Loading"></div>
<script src="../../assets/site-nav.js"></script>
</body>
</html>
