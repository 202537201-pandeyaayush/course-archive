<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0">
<title>Aayush - Fixed Navigation</title>
<style>
  *{box-sizing:border-box;margin:0;padding:0}
  body{font-family:Arial,sans-serif}
  .nav{position:fixed;top:0;left:0;right:0;z-index:100;
       background:#1e293b;display:flex;justify-content:space-between;
       align-items:center;padding:16px 30px}
  .nav-logo{color:white;font-weight:700;text-decoration:none;font-size:20px}
  .nav-links{display:flex;gap:24px}
  .nav-links a{color:#cbd5e1;text-decoration:none;transition:color .2s}
  .nav-links a:hover{color:#14b8a6}
  .content{padding-top:70px}
  .section{height:320px;padding:45px;font-size:20px}
</style>
</head>
<body>
<nav class="nav">
  <a class="nav-logo" href="#">Aayush Pandey</a>
  <div class="nav-links">
    <a href="#s1">Home</a><a href="#s2">Projects</a><a href="#s3">Skills</a>
  </div>
</nav>
<div class="content">
  <section class="section" id="s1" style="background:#f0fdfa">Home — scroll down to test the fixed bar.</section>
  <section class="section" id="s2" style="background:#ccfbf1">Projects — software and design practice.</section>
  <section class="section" id="s3" style="background:#99f6e4">Skills — CSS, software engineering, graphic design and video editing.</section>
</div>
<script src="../../assets/site-nav.js"></script>
</body>
</html>
