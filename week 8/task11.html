<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>Contact Form Homework | Week 8</title><link rel="stylesheet" href="style.css"></head><body><nav class="bar"><div><a class="brand" href="../index.html">Web Programming</a><span class="crumb">/</span><a class="brand" href="index.html">Week 8</a></div><a class="back" href="index.html">Back</a></nav><header class="hero"><p class="eyebrow">BONUS · HOMEWORK</p><h1>Contact Form Homework</h1><p>Create a contact form with name, email, subject, and message plus validation.</p></header><main class="wrap"><section class="panel"><form class="demo" onsubmit="event.preventDefault();document.getElementById('result').textContent='Thanks! Your form is valid, but no message was sent or stored.'"><fieldset><legend>Contact details</legend><div class="field"><label for="contact-name">Name</label><input id="contact-name" placeholder="Your name" minlength="2" required></div><div class="field"><label for="contact-email">Email</label><input id="contact-email" type="email" placeholder="you@example.com" required></div><div class="field"><label for="subject">Subject</label><input id="subject" placeholder="What is your message about?" minlength="3" required></div><div class="field"><label for="contact-message">Message</label><textarea id="contact-message" rows="5" minlength="10" maxlength="500" placeholder="Write your message (10–500 characters)" required></textarea></div></fieldset><button class="btn">Send message</button></form><p id="result" class="result" aria-live="polite">All fields are required. This is a local demo only.</p><div class="tasknav"><a class="back" href="task10.html">← Previous task</a> </div></section></main><footer class="footer">Pandey Aayush · Student ID: 202537201</footer></body></html>
